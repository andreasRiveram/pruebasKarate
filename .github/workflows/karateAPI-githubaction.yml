name: Karate Tests Pipeline

on:
  push:
    branches: [ "Envio-SMS-karate" ]
  workflow_dispatch:
    inputs:
      karate_tag:
        description: 'Tag que deseas ejecutar individualmente'
        required: true
        default: '@componenteSMS' # Tu primer tag a probar

jobs:
  karate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ejecutar Pruebas Karate
        env:
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_SECRET_TOKEN: ${{ secrets.SMS_SECRET_TOKEN }}
          # Toma el input si lo ejecutas manualmente; si es por push, usa @componenteSMS
          EXEC_TAG: ${{ inputs.karate_tag || '@componenteSMS' }}
        run: |
          mvn test -Dkarate.options="--tags '${{ env.EXEC_TAG }}'"